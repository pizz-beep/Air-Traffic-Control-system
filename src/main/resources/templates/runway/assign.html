<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Assign Runway</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">
<h2>Assign Runway</h2>
<form action="/runways/assign" method="post">
  <div class="mb-3">
    <label>Flight ID</label>
    <input type="text" name="flightId" class="form-control"/>
  </div>
  <div class="mb-3">
    <label>Select Runway</label>
    <select name="runwayId" class="form-select">
      <option th:each="r : ${available}"
              th:value="${r.runwayId}"
              th:text="${r.runwayId + ' - ' + r.direction}"/>
    </select>
  </div>
  <button type="submit" class="btn btn-warning">Assign Runway</button>
</form>
</body></html>
