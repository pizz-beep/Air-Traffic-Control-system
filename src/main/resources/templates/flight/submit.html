<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Submit Flight Plan</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">
<h2>Submit Flight Plan</h2>
<form th:action="@{/flights/submit}" th:object="${flight}" method="post">
  <div class="mb-3">
    <label>Flight ID</label>
    <input type="text" th:field="*{flightId}" class="form-control"/>
  </div>
  <div class="mb-3">
    <label>Source Airport</label>
    <input type="text" th:field="*{source}" class="form-control"/>
  </div>
  <div class="mb-3">
    <label>Destination Airport</label>
    <input type="text" th:field="*{destination}" class="form-control"/>
  </div>
  <div class="mb-3">
    <label>Scheduled Departure</label>
    <input type="datetime-local" th:field="*{scheduledDeparture}"
           class="form-control"/>
  </div>
  <button type="submit" class="btn btn-primary">Submit Plan</button>
  <a href="/flights" class="btn btn-secondary">Cancel</a>
</form>
</body></html>
