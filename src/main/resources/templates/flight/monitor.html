<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>ATC - Flight Monitor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">
<h2>Active Flights Monitor</h2>

<h4>In Progress</h4>
<table class="table table-bordered table-striped mb-5">
  <thead class="table-success">
    <tr><th>Flight ID</th><th>From</th><th>To</th><th>Status</th><th>Runway</th></tr>
  </thead>
  <tbody>
    <tr th:each="f : ${activeFlights}">
      <td th:text="${f.flightId}"></td>
      <td th:text="${f.source}"></td>
      <td th:text="${f.destination}"></td>
      <td th:text="${f.status}"></td>
      <td th:text="${f.runway != null ? f.runway.runwayId : 'Unassigned'}"></td>
    </tr>
  </tbody>
</table>

<h4>Pending Output</h4>
<table class="table table-bordered table-striped">
  <thead class="table-warning">
    <tr><th>Flight ID</th><th>From</th><th>To</th><th>Status</th></tr>
  </thead>
  <tbody>
    <tr th:each="f : ${pendingFlights}">
      <td th:text="${f.flightId}"></td>
      <td th:text="${f.source}"></td>
      <td th:text="${f.destination}"></td>
      <td th:text="${f.status}"></td>
    </tr>
  </tbody>
</table>

<a href="/flights" class="btn btn-secondary">Back to Flight List</a>
</body>
</html>
